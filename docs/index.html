tial",description:"Soft texture with a little extra height.",steps:["Yarn over, then insert your hook into the next stitch.","Yarn over and pull up a loop: three loops on the hook.","Yarn over and pull through all three loops."],tip:"For the sample patterns, a turning chain does not count as a stitch."},{id:"dc",name:"Double crochet",abbr:"dc",kind:"Essential",description:"Tall, airy, and perfect for cozy layers.",steps:["Yarn over and insert your hook into the next stitch.","Yarn over and pull up a loop. Yarn over and pull through two loops.","Yarn over once more and pull through the remaining two loops."],tip:"US double crochet is called treble crochet in UK terminology."},{id:"mr",name:"Magic ring",abbr:"MR",kind:"In the round",description:"An adjustable beginning for round projects.",steps:["Loop the yarn around two fingers, with the tail crossing under the working yarn.","Insert your hook into the loop, catch the working yarn and pull up a loop. Chain 1 to secure.","Work the specified number of single crochets into the ring, over the tail. Pull the tail to close the center."],tip:"Weave the tail in securely; pulling the ring closed alone does not secure it."},{id:"inc",name:"Increase",abbr:"inc",kind:"Shaping",description:"Make room for your project to grow.",steps:["Work one single crochet into the next stitch.","Work a second single crochet into that same stitch. You have turned one stitch into two."],tip:"The sample patterns use single crochet increases."},{id:"dec",name:"Invisible decrease",abbr:"inv dec",kind:"Shaping",description:"Bring two stitches together with a tidy finish.",steps:["Insert the hook through the front loop of each of the next two stitches.","Yarn over and pull through those two front loops. Two loops remain on the hook.","Yarn over and pull through both loops. Two stitches have become one."],tip:"Works best with single crochet in the round, with the right side facing out."},{id:"blo",name:"Back loop only",abbr:"BLO",kind:"Texture",description:"A simple change that creates beautiful ridges.",steps:["Find the V at the top of the next stitch. The back loop is the side farther away from you.","Insert your hook under just that back loop, then work the stitch your pattern requests."],tip:"BLO describes where to insert your hook, rather than a separate stitch."},{id:"tr",name:"Treble crochet",abbr:"tr",kind:"Tall stitches",description:"An open, tall stitch for airy fabric.",steps:["Yarn over twice, then insert the hook into the next stitch.","Yarn over and pull up a loop. Four loops are now on the hook.","Yarn over and pull through two loops, three times. One loop remains."],tip:"US treble crochet is UK double treble crochet. Turning chains depend on your pattern."},{id:"bobble",name:"Bobble stitch",abbr:"bo",kind:"Texture",description:"A raised cluster that gives fabric a playful bump.",steps:["For this five-leg double-crochet bobble, yarn over, insert into the specified stitch, yarn over and pull up a loop, then yarn over and pull through two loops. Leave the unfinished stitch on the hook.","Repeat that unfinished double crochet four more times in the same stitch. Six loops remain on the hook.","Yarn over and pull through all six loops. Follow the pattern for the next stitch and which side the bump should face."],tip:"Bobble recipes vary in the number of legs and securing stitches. Use the pattern's definition; do not add a chain unless it asks for one."},{id:"shell",name:"Shell stitch",abbr:"shell",kind:"Texture",description:"A fan of tall stitches worked into one place.",steps:["For a basic five-double-crochet shell, identify the stitch or chain space specified in the pattern.","Work five complete double crochets into that same stitch or space.","Follow the pattern for skipped stitches and the stitch between shells."],tip:"A shell may use a different stitch or number of stitches. A five-dc shell makes five stitches, not one."},{id:"puff",name:"Puff stitch",abbr:"puff",kind:"Texture",description:"A soft, rounded bundle of elongated loops.",steps:["For a three-draw puff, yarn over, insert into the specified stitch, yarn over and draw up a tall loop.","Repeat that draw-up sequence twice more in the same stitch. Seven loops are on the hook.","Yarn over and draw through all seven loops. Secure only as directed by your pattern."],tip:"Puff stitch height, loop count, and closing method vary by pattern. Avoid pulling the loops tight too early."},{id:"popcorn",name:"Popcorn stitch",abbr:"pc",kind:"Texture",description:"A pronounced raised stitch made by joining a small group.",steps:["For a five-dc popcorn, work five double crochets in the same stitch or space.","Drop the working loop carefully. Insert the hook through the top of the first double crochet in that group.","Pick up the dropped loop and pull it through the first double crochet. Secure as your pattern directs."],tip:"Front-facing and back-facing popcorns are joined differently. Check which face of the fabric should show the bump."},{id:"cluster",name:"Double crochet cluster",abbr:"dc cl",kind:"Texture",description:"Several unfinished stitches joined at their tops.",steps:["For a three-dc cluster in one place, begin a double crochet in the specified stitch or space, but stop after pulling through two loops.","Make two more unfinished double crochets in that same place. Four loops remain on the hook.","Yarn over and pull through all four loops."],tip:"Clusters can also span several stitches. The pattern must tell you whether to use one space or multiple stitches."},{id:"fpdc",name:"Front post double crochet",abbr:"FPdc",kind:"Post stitches",description:"Work around a stitch's post to bring texture forward.",steps:["Yarn over. From the front, insert the hook to the back beside the indicated stitch post, then bring it to the front on the other side of that post.","Yarn over and pull up a loop around the post.","Finish a double crochet: yarn over and pull through two loops, then repeat."],tip:"You work around the vertical post, not into the top loops. Keep track of which stitch in the current row this replaces."},{id:"bpdc",name:"Back post double crochet",abbr:"BPdc",kind:"Post stitches",description:"Work around the back of a post for recessed texture.",steps:["Yarn over. From the back, bring the hook to the front beside the indicated post, then return it to the back on the other side.","Yarn over and draw up a loop around the post.","Yarn over and pull through two loops twice to complete the double crochet."],tip:"Front and back refer to the side currently facing you, unless the pattern defines them differently."},{id:"picot",name:"Picot",abbr:"picot",kind:"Edgings",description:"A small decorative point along an edge.",steps:["For one common picot, chain three after the stitch specified by the pattern.","Slip stitch into the first of those three chains to form a small loop.","Continue along the edge as instructed."],tip:"Some picots join into the base stitch instead. Use the joining location given by your pattern."},{id:"crab",name:"Reverse single crochet",abbr:"rsc",kind:"Edgings",description:"A corded edge made by working in the reverse direction.",steps:["With the right side facing, work toward the side opposite your usual direction of crochet.","Insert the hook into the next stitch in that reverse direction, yarn over and pull up a loop.","Yarn over and pull through both loops. Repeat with relaxed tension."],tip:"Also called crab stitch. Right-handed crocheters usually move left to right for this edging."},{id:"waistcoat",name:"Waistcoat stitch",abbr:"wc",kind:"Texture",description:"A single-crochet variation with a knit-like appearance.",steps:["Find the center of the V on the front of the next single crochet, below its top loops.","Insert through that center, yarn over and draw up a loop.","Yarn over and pull through both loops, as for single crochet."],tip:"Loose tension helps. This guide describes the common in-the-round version; flat versions may use a different return-row placement."},{id:"spike",name:"Spike stitch",abbr:"spike sc",kind:"Texture",description:"An elongated stitch anchored into an earlier row.",steps:["Insert the hook into the stitch in the earlier row specified by the pattern.","Yarn over and draw the loop up to the height of the current row without tightening the fabric.","Yarn over and pull through both loops to complete the elongated single crochet."],tip:"The pattern must specify how far down to insert and which current-row stitch is replaced. Do not add an extra stitch by accident."},{id:"vstitch",name:"V stitch",abbr:"V-st",kind:"Lace and combinations",description:"Two tall stitches separated by a chain space.",steps:["For a common V stitch, work one double crochet into the specified stitch or space.","Chain one, then work another double crochet into the same location.","Follow the pattern for the spacing between V stitches and the next row's placement."],tip:"A V stitch often means (dc, ch 1, dc), but definitions vary. Read the stitch key."},{id:"moss",name:"Moss stitch",abbr:"moss",kind:"Lace and combinations",description:"A woven-looking fabric made from single crochets and chain spaces.",steps:["After the foundation specified by your pattern, alternate single crochet and chain one, skipping the stitch below each chain.","On later rows, work the single crochets into the previous row's chain-one spaces.","Use the pattern's turning chains and edge stitches to keep the sides even."],tip:"Also called linen or granite stitch in some patterns. Foundation and edge counts depend on the pattern."},{id:"granny",name:"Granny cluster",abbr:"granny cl",kind:"Lace and combinations",description:"Groups of double crochets with open spaces between them.",steps:["For a common granny group, work three complete double crochets into the indicated space.","Work the separating chain or skip specified by your pattern.","Place later groups into the spaces between groups; use the pattern's corner instructions if working a sq
